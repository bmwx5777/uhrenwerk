services:
  postgres:
    image: postgres:18-alpine
    container_name: uhrenwerk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: uhrenwerk
      POSTGRES_PASSWORD: uhrenwerk_local
      POSTGRES_DB: uhrenwerk
    ports:
      - "5432:5432"
    volumes:
      # В образах postgres:18+ монтируется /var/lib/postgresql, а не .../data
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uhrenwerk -d uhrenwerk"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
