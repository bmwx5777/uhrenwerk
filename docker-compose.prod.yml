# Production на своём сервере: база, приложение, HTTPS и задача по расписанию.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Подробно — DEPLOY.md, раздел «Свой сервер».

name: uhrenwerk

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgresql://uhrenwerk:${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD}@postgres:5432/uhrenwerk
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?задайте BETTER_AUTH_SECRET}
  NEXT_PUBLIC_APP_URL: https://${DOMAIN:?задайте DOMAIN}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  EMAIL_FROM: ${EMAIL_FROM:-}
  CRON_SECRET: ${CRON_SECRET:?задайте CRON_SECRET}
  BANK_BENEFICIARY: ${BANK_BENEFICIARY:-}
  BANK_IBAN: ${BANK_IBAN:-}
  BANK_BIC: ${BANK_BIC:-}
  BANK_NAME: ${BANK_NAME:-}

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: uhrenwerk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD}
      POSTGRES_DB: uhrenwerk
    # Порт наружу не открываем: база доступна только контейнерам.
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uhrenwerk -d uhrenwerk"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Миграции — отдельный одноразовый шаг: отрабатывает и завершается,
  # приложение стартует только после его успеха.
  migrate:
    build:
      context: .
      target: builder
      args:
        NEXT_PUBLIC_APP_URL: https://${DOMAIN}
    image: uhrenwerk-tools
    environment: *app-env
    command: ["npx", "drizzle-kit", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_APP_URL: https://${DOMAIN}
    image: uhrenwerk-app
    restart: unless-stopped
    environment: *app-env
    volumes:
      - uploads:/app/public/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/robots.txt"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # HTTPS: Caddy сам получает и продлевает сертификат Let's Encrypt.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - uploads:/srv/uploads:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

  # Снятие резерва с неоплаченных заказов каждые 10 минут.
  cron:
    image: curlimages/curl:8.11.1
    restart: unless-stopped
    environment:
      CRON_SECRET: ${CRON_SECRET}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          sleep 600
          curl -fsS -H "Authorization: Bearer $$CRON_SECRET" http://app:3000/api/cron/release-reservations || true
          echo
        done
    depends_on:
      - app

volumes:
  postgres-data:
  uploads:
  caddy-data:
  caddy-config:
